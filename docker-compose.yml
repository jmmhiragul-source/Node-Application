services:
  app:
    build: .
    image: my-express-app
    ports:
      - "3000:3000"
    # Which database to use is decided by which env file is loaded.
    # Default = .env (RDS). Override with APP_ENV=.env.local for the local DB.
    env_file:
      - ${APP_ENV:-.env}
    restart: unless-stopped

  # Local MySQL — only starts when you pass `--profile local`.
  # With no profile (the default), this service is skipped entirely.
  db:
    image: mysql:8.0
    profiles: ["local"]
    environment:
      MYSQL_DATABASE: my_auth_app
      MYSQL_ROOT_PASSWORD: 12345678
    ports:
      # Host 3307 -> container 3306 (3306 is often taken by a local MySQL).
      # The app connects internally as db:3306, so this is only for host tools.
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p12345678"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
